on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync Submodules"]
    types:
      - completed

jobs:
  deploy:
    name: "Deploy v4000 Docs on Cloudflare Workers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Checkout submodule to v4000
        run: |
          cd kaplay
          git fetch --tags
          TAG=$(git tag --list '4000*' --sort=-v:refname creatordate | head -n 1)
          echo $TAG
          git checkout $TAG
      - name: Install dependencies
        run: npm i
      - name: Build website
        run: npm build
      - name: Deploy app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_KEY }}
          command: pages deploy dist --project-name=kaplay4000

  deploy3001:
    name: "Deploy v3001 Docs on Cloudflare Workers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Checkout submodule to v3001
        run: |
          cd kaplay
          git fetch origin v3001
          git checkout FETCH_HEAD
      - name: Install dependencies
        run: npm i
      - name: Build website
        run: npm build
      - name: Deploy app
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_KEY }}
          command: pages deploy dist --project-name=kaplay3001
