on:
  pull_request:
    branches: ["main"]

jobs:
  check:
    name: "Deploy v4000 Docs on Cloudflare Workers"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm i

      - name: Run checker
        run: npm run check